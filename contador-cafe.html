<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Muley Coffee</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --esp:#2E1B12;--esps:#4A2F20;--crm:#F7EEE0;--crmd:#EDE0C8;
  --car:#C1812F;--card:#9C5F1F;--ppr:#FFFCF6;--grn:#6E8B6E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 20%,rgba(193,129,47,.08) 0,transparent 45%),
    radial-gradient(circle at 80% 80%,rgba(193,129,47,.06) 0,transparent 45%),var(--crm);
  font-family:'Inter',sans-serif;color:var(--esp);padding:24px 16px;
}
.card{
  background:var(--ppr);border-radius:28px;max-width:370px;width:100%;
  padding:34px 26px 28px;text-align:center;
  box-shadow:0 20px 60px -20px rgba(46,27,18,.28);border:1px solid var(--crmd);
}
.eyebrow{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--card);font-weight:700;}
h1{font-family:'Fraunces',serif;font-size:1.45rem;font-weight:600;margin:12px 0 4px;color:var(--esp);}
p.sub{font-size:.9rem;color:var(--esps);line-height:1.5;margin-top:6px;}
/* Taza SVG */
.mug-wrap{position:relative;width:150px;height:170px;margin:20px auto 6px;}
.steam{position:absolute;width:5px;height:26px;border-radius:4px;
  background:rgba(193,129,47,.35);opacity:0;animation:rise 2.4s ease-in-out infinite;}
.steam.s1{left:52px;top:-26px;animation-delay:0s;}
.steam.s2{left:72px;top:-26px;animation-delay:.65s;}
.steam.s3{left:92px;top:-26px;animation-delay:1.3s;}
@keyframes rise{0%{opacity:0;transform:translateY(0);}35%{opacity:.65;}100%{opacity:0;transform:translateY(-18px);}}
.plabel{font-size:.82rem;color:var(--esps);margin-top:12px;}
.plabel strong{color:var(--card);}
.winner-box{margin:18px 0 6px;background:var(--crm);border:1.5px dashed var(--car);border-radius:14px;padding:16px;}
.winner-box .code{font-family:monospace;font-weight:700;font-size:1.25rem;letter-spacing:.05em;color:var(--esp);}
.winner-box .hint{font-size:.72rem;color:var(--esps);margin-top:4px;}
button.copybtn{margin-top:10px;border:none;background:var(--car);color:var(--ppr);
  font-weight:600;font-size:.83rem;padding:9px 18px;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;}
button.copybtn:active{background:var(--card);}
.contact{margin-top:18px;padding-top:16px;border-top:1px solid var(--crmd);display:flex;flex-direction:column;gap:8px;}
.contact a{font-size:.82rem;color:var(--esps);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;}
.fnote{margin-top:20px;font-size:.68rem;color:#A7967F;}
</style>
</head>
<body>
<main class="card" id="app"><p class="eyebrow">Muley Coffee</p><h1>Cargando…</h1></main>
<script>
const C={
  name:"Muley Coffee",
  cada:50,
  cooldown:30,
  ntfy:"cafe-retiro-luis-7gx2k9",
  bin:"6a35da17f5f4af5e2912180b",
  key:"$2a$10$yFR5K98Hokx1AAmsjdgJjef5HeSUGsHbMRbzDDOa0f0qa2yKHawtW"
};
const API="https://api.jsonbin.io/v3/b/"+C.bin;
const app=document.getElementById('app');
const CD_KEY='muley-last-visit';

function contact(){return`<div class="contact">
  <a href="https://instagram.com/muley_coffee" target="_blank">📷 @muley_coffee</a>
  <a href="https://maps.google.com/?q=Avda.+Errazuriz+620" target="_blank">📍 Avda. Errazuriz 620</a>
  <a href="tel:+56944572336">📞 +569 4457 2336</a>
</div>`;}

function mugSVG(pct,winner,label){
  const fp=Math.max(0,Math.min(100,pct));
  const fillY=128-(fp/100)*108;
  const sh=128-fillY;
  const id='f'+Date.now();
  setTimeout(()=>{
    const el=document.getElementById(id);
    if(el){el.style.transform=`translateY(-${sh}px)`;}
    const tx=document.getElementById(id+'t');
    if(tx&&fp>10){setTimeout(()=>{tx.style.opacity='1';},900);}
  },80);
  return`<div class="mug-wrap">
  ${winner?'<div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div>':''}
  <svg viewBox="0 0 150 170" width="150" height="170" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="mc"><path d="M25,18 L25,10 Q25,4 31,4 L105,4 Q111,4 111,10 L111,18 L106,132 Q105,140 98,142 L38,142 Q31,140 30,132 Z"/></clipPath>
      <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C1812F"/><stop offset="100%" stop-color="#7A4010"/>
      </linearGradient>
      <linearGradient id="mg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#E0D0B8"/><stop offset="50%" stop-color="#F7EEE0"/><stop offset="100%" stop-color="#CFC0A0"/>
      </linearGradient>
    </defs>
    <!-- plato -->
    <ellipse cx="68" cy="156" rx="50" ry="8" fill="#D4C4AA"/>
    <ellipse cx="68" cy="153" rx="50" ry="8" fill="#EDE0C8"/>
    <!-- cuerpo fondo -->
    <path d="M25,18 L25,10 Q25,4 31,4 L105,4 Q111,4 111,10 L111,18 L106,132 Q105,140 98,142 L38,142 Q31,140 30,132 Z" fill="url(#mg)"/>
    <!-- café -->
    <g clip-path="url(#mc)">
      <rect id="${id}" x="25" y="128" width="88" height="116" fill="url(#cg)" style="transition:transform 1.2s cubic-bezier(.22,1,.36,1);"/>
    </g>
    <!-- borde taza -->
    <path d="M25,18 L25,10 Q25,4 31,4 L105,4 Q111,4 111,10 L111,18 L106,132 Q105,140 98,142 L38,142 Q31,140 30,132 Z" fill="none" stroke="#C8B89A" stroke-width="1.5"/>
    <!-- asa -->
    <path d="M111,38 Q146,38 146,72 Q146,108 111,108" fill="none" stroke="#D4C4AA" stroke-width="11" stroke-linecap="round"/>
    <path d="M111,38 Q140,38 140,72 Q140,108 111,108" fill="none" stroke="#EDE0C8" stroke-width="7" stroke-linecap="round"/>
    <!-- borde superior -->
    <line x1="25" y1="18" x2="111" y2="18" stroke="#C8B89A" stroke-width="1.5" opacity=".6"/>
    ${winner?`<ellipse cx="68" cy="18" rx="40" ry="6" fill="#F5E6CC" opacity=".9"/>
    <ellipse cx="56" cy="17" rx="10" ry="4" fill="#FFFCF6" opacity=".5"/>`:``}
    <!-- texto -->
    <text id="${id}t" x="68" y="85" text-anchor="middle" dominant-baseline="middle"
      font-family="'Fraunces',Georgia,serif" font-size="15" font-weight="600"
      fill="#FFFCF6" opacity="0" style="transition:opacity .5s ease;">
      ${label}
    </text>
  </svg>
</div>`;}

function renderParticipant(count){
  const mod=count%C.cada;
  const rem=C.cada-mod;
  const pct=(mod/C.cada)*100;
  const lbl=rem===1?'¡1 más!':`faltan ${rem}`;
  app.innerHTML=`
    <p class="eyebrow">${C.name}</p>
    <h1>¡Gracias por tu visita!</h1>
    ${mugSVG(pct,false,lbl)}
    <p class="plabel">Eres la visita N.º <strong>${count}</strong></p>
    <p class="plabel">Faltan <strong>${rem}</strong> visita${rem>1?'s':''} para el próximo café gratis ☕</p>
    <p class="sub" style="margin-top:10px;">Escanea el código en tu próxima visita para seguir participando.</p>
    ${contact()}
    <p class="fnote">${C.name} · promoción de visitas</p>`;
}

function renderWinner(count,code){
  app.innerHTML=`
    <p class="eyebrow">${C.name}</p>
    <h1>¡Ganaste un café! 🎉</h1>
    ${mugSVG(100,true,'¡Ganaste!')}
    <p class="plabel">Fuiste la visita N.º <strong>${count}</strong></p>
    <div class="winner-box">
      <div class="code" id="codeText">${code}</div>
      <div class="hint">Tu código de premio</div>
      <button class="copybtn" id="cpBtn">Copiar código</button>
    </div>
    <p class="sub">Muestra este código en caja para canjear tu café gratis.</p>
    ${contact()}
    <p class="fnote">${C.name} · promoción de visitas</p>`;
  document.getElementById('cpBtn').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(code);
      document.getElementById('cpBtn').textContent='¡Copiado!';
      setTimeout(()=>{document.getElementById('cpBtn').textContent='Copiar código';},1800);
    }catch(e){}
  });
}

function renderCooldown(){
  app.innerHTML=`
    <p class="eyebrow">${C.name}</p>
    <h1>Ya registramos tu visita ☕</h1>
    <p class="sub" style="margin-top:12px;">Vuelve a escanear en tu próxima visita para seguir participando.</p>
    ${contact()}`;
}

function renderError(){
  app.innerHTML=`
    <p class="eyebrow">${C.name}</p>
    <h1>Error al registrar</h1>
    <p class="sub" style="margin-top:10px;">Intenta escanear el código nuevamente en un momento.</p>`;
}

function genCode(n){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];
  return`CAFE-${n}-${s}`;
}

function sendAlert(n,code){
  fetch(`https://ntfy.sh/${C.ntfy}`,{method:'POST',
    body:`Ganador visita #${n} - Codigo: ${code}`,
    headers:{'Title':'🎉 Ganador Muley Coffee','Tags':'tada'}
  }).catch(()=>{});
}

async function getRecord(){
  const r=await fetch(API+"/latest",{headers:{'X-Master-Key':C.key,'X-Bin-Meta':'false'}});
  if(!r.ok)throw new Error('read');
  const d=await r.json();
  if(typeof d.count!=='number')d.count=0;
  if(!d.winners)d.winners={};
  if(!Array.isArray(d.visits))d.visits=[];
  if(!d.customers)d.customers={};
  return d;
}

async function putRecord(d){
  const r=await fetch(API,{method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':C.key},
    body:JSON.stringify(d)});
  if(!r.ok)throw new Error('write');
}

async function getCity(){
  try{const r=await fetch('https://ipapi.co/json/');
    if(!r.ok)return'Desconocida';
    const g=await r.json();
    return g.city?(g.region?`${g.city}, ${g.region}`:g.city):'Desconocida';
  }catch{return'Desconocida';}
}

function getDevice(){
  const u=navigator.userAgent||'';
  if(/android/i.test(u))return'Android';
  if(/iphone|ipad/i.test(u))return'iPhone';
  return'Otro';
}

async function main(){
  // cooldown
  try{
    const last=localStorage.getItem(CD_KEY);
    if(last&&(Date.now()-parseInt(last))<C.cooldown*60*1000){renderCooldown();return;}
  }catch(e){}

  let rec,count;
  try{rec=await getRecord();count=rec.count+1;rec.count=count;}
  catch(e){renderError();return;}

  try{localStorage.setItem(CD_KEY,String(Date.now()));}catch(e){}

  const city=await getCity();
  rec.visits.push({ts:Date.now(),city,device:getDevice()});
  if(rec.visits.length>2000)rec.visits=rec.visits.slice(-2000);

  const isWinner=count%C.cada===0;
  let code=null;
  if(isWinner){
    code=genCode(count);
    rec.winners[code]={visitNumber:count,ts:Date.now(),redeemed:false,redeemedAt:null};
  }

  try{await putRecord(rec);}catch(e){renderError();return;}

  if(isWinner){sendAlert(count,code);renderWinner(count,code);}
  else{renderParticipant(count);}
}

main();
</script>
</body>
</html>
