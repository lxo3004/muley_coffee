<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Café Premiado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#2E1B12;
    --espresso-soft:#4A2F20;
    --cream:#F7EEE0;
    --cream-deep:#EDE0C8;
    --caramel:#C1812F;
    --caramel-deep:#9C5F1F;
    --sage:#6E8B6E;
    --paper:#FFFCF6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(193,129,47,0.07) 0, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(193,129,47,0.06) 0, transparent 40%),
      var(--cream);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--espresso);
    padding:24px 16px;
  }
  .card{
    background:var(--paper);
    border-radius:28px;
    max-width:380px;
    width:100%;
    padding:36px 28px 30px;
    text-align:center;
    box-shadow:0 20px 50px -20px rgba(46,27,18,0.25);
    border:1px solid var(--cream-deep);
  }
  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:1.5rem;
    margin:18px 0 6px;
    color:var(--espresso);
  }
  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--caramel-deep);
    font-weight:600;
    margin:0;
  }
  p.sub{
    font-size:0.95rem;
    color:var(--espresso-soft);
    line-height:1.5;
    margin:6px 0 0;
  }
  .cup-wrap{ position:relative; width:160px; height:180px; margin:18px auto 4px; }
  .steam{
    position:absolute; width:5px; height:28px;
    background:rgba(193,129,47,0.35); border-radius:4px; opacity:0;
    animation:rise 2.4s ease-in-out infinite;
  }
  .steam.s1{left:56px; top:-28px; animation-delay:0s;}
  .steam.s2{left:76px; top:-28px; animation-delay:0.6s;}
  .steam.s3{left:96px; top:-28px; animation-delay:1.2s;}
  @keyframes rise{
    0%{opacity:0; transform:translateY(0) scaleY(0.7);}
    30%{opacity:0.6;}
    100%{opacity:0; transform:translateY(-20px) scaleY(1.1);}
  }
  .mug-pct{
    position:absolute;
    top:50%; left:0; right:0;
    transform:translateY(-50%);
    font-family:'Fraunces',Georgia,serif;
    font-size:1.1rem;
    font-weight:600;
    color:var(--paper);
    text-align:center;
    pointer-events:none;
    text-shadow:0 1px 3px rgba(46,27,18,0.4);
    opacity:0;
    transition:opacity 0.5s ease 0.8s;
  }
  .mug-pct.visible{ opacity:1; }
  .progress-label{ font-size:0.85rem; color:var(--espresso-soft); margin-top:14px; }
  .progress-label strong{color:var(--caramel-deep);}
  .contact{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--cream-deep);
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .contact a{
    font-size:0.82rem;
    color:var(--espresso-soft);
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .contact a:hover{ color:var(--caramel-deep); }
  .code-box{
    margin:20px 0 6px; background:var(--cream);
    border:1.5px dashed var(--caramel); border-radius:14px; padding:16px;
  }
  .code-box .code{
    font-family:'Inter',monospace; font-weight:700; font-size:1.3rem;
    letter-spacing:0.04em; color:var(--espresso);
  }
  .code-box .code-hint{ font-size:0.72rem; color:var(--espresso-soft); margin-top:4px; }
  button.copy{
    margin-top:10px; border:none; background:var(--caramel); color:var(--paper);
    font-weight:600; font-size:0.85rem; padding:10px 18px; border-radius:999px;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  button.copy:active{background:var(--caramel-deep);}
  .instructions{ font-size:0.85rem; color:var(--espresso-soft); line-height:1.5; margin-top:14px; }
  .footer-note{ margin-top:22px; font-size:0.7rem; color:#A7967F; }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>
<body>
  <main class="card" id="app">
    <p class="eyebrow">Cargando…</p>
  </main>

<script>
/* ======== CONFIGURACIÓN — edita estos valores ======== */
const CONFIG = {
  cafeName: "Muley Coffee",
  premioCada: 30,
  cooldownMinutes: 30,
  ntfyTopic: "cafe-retiro-luis-7gx2k9",
  binId: "6a35da17f5f4af5e2912180b",
  masterKey: "$2a$10$yFR5K98Hokx1AAmsjdgJjef5HeSUGsHbMRbzDDOa0f0qa2yKHawtW",
};
/* ======================================================= */

const API = "https://api.jsonbin.io/v3/b/" + CONFIG.binId;
const app = document.getElementById('app');

function cupHTML(fillPercent, winner, label){
  const pct = Math.max(0, Math.min(100, fillPercent));
  // mug body: fills from bottom. clipRect y goes from 130 (empty) to 20 (full) over 110px
  const fillY = 130 - (pct / 100) * 110;
  return `
    <div class="cup-wrap" style="position:relative;width:160px;height:180px;margin:18px auto 4px;">
      ${winner ? `<div class="steam s1"></div><div class="steam s2"></div><div class="steam s3"></div>` : ``}
      <svg viewBox="0 0 160 180" xmlns="http://www.w3.org/2000/svg" width="160" height="180">
        <defs>
          <clipPath id="mugClip">
            <!-- mug body shape -->
            <path d="M28,20 Q26,18 26,16 L26,10 Q26,6 30,6 L110,6 Q114,6 114,10 L114,16 Q114,18 112,20 L108,135 Q107,142 100,144 L40,144 Q33,142 32,135 Z"/>
          </clipPath>
          <clipPath id="fillClip">
            <rect id="fillRect" x="26" y="130" width="90" height="110"/>
          </clipPath>
          <linearGradient id="coffeeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#C1812F"/>
            <stop offset="100%" stop-color="#7A4010"/>
          </linearGradient>
          <linearGradient id="mugGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#EDE0C8"/>
            <stop offset="40%" stop-color="#F7EEE0"/>
            <stop offset="100%" stop-color="#D4C4AA"/>
          </linearGradient>
        </defs>

        <!-- saucer -->
        <ellipse cx="70" cy="158" rx="52" ry="8" fill="#D4C4AA"/>
        <ellipse cx="70" cy="155" rx="52" ry="8" fill="#EDE0C8"/>
        <ellipse cx="70" cy="153" rx="40" ry="5" fill="#D4C4AA" opacity="0.5"/>

        <!-- mug body background -->
        <path d="M28,20 Q26,18 26,16 L26,10 Q26,6 30,6 L110,6 Q114,6 114,10 L114,16 Q114,18 112,20 L108,135 Q107,142 100,144 L40,144 Q33,142 32,135 Z" fill="url(#mugGrad)"/>

        <!-- coffee fill (clipped to mug shape) -->
        <g clip-path="url(#mugClip)">
          <rect id="coffeeFill" x="26" y="130" width="90" height="110"
            fill="url(#coffeeGrad)"
            style="transform:translateY(0);transition:transform 1.2s cubic-bezier(.22,1,.36,1)"/>
        </g>

        <!-- mug rim highlight -->
        <path d="M28,20 L112,20" stroke="#C8B89A" stroke-width="1.5" fill="none" opacity="0.6"/>

        <!-- mug body outline -->
        <path d="M28,20 Q26,18 26,16 L26,10 Q26,6 30,6 L110,6 Q114,6 114,10 L114,16 Q114,18 112,20 L108,135 Q107,142 100,144 L40,144 Q33,142 32,135 Z"
          fill="none" stroke="#C8B89A" stroke-width="1.5"/>

        <!-- handle -->
        <path d="M114,40 Q148,40 148,75 Q148,110 114,110"
          fill="none" stroke="#D4C4AA" stroke-width="11" stroke-linecap="round"/>
        <path d="M114,40 Q142,40 142,75 Q142,110 114,110"
          fill="none" stroke="#EDE0C8" stroke-width="7" stroke-linecap="round"/>

        <!-- foam / crema on top when full -->
        ${winner ? `<ellipse cx="70" cy="20" rx="40" ry="6" fill="#F5E6CC" opacity="0.9"/>
        <ellipse cx="58" cy="19" rx="10" ry="4" fill="#FFFCF6" opacity="0.5"/>
        <ellipse cx="82" cy="21" rx="8" ry="3" fill="#FFFCF6" opacity="0.4"/>` : ``}

        <!-- percentage text inside mug -->
        <text id="pctText" x="70" y="88" text-anchor="middle" dominant-baseline="middle"
          font-family="'Fraunces',Georgia,serif" font-size="18" font-weight="600"
          fill="#FFFCF6" opacity="0"
          style="text-shadow:0 1px 3px rgba(46,27,18,0.5);">
          ${label}
        </text>
      </svg>
    </div>
    <script>
      (function(){
        // animate fill upward
        const fill = document.getElementById('coffeeFill');
        const txt  = document.getElementById('pctText');
        const targetY = ${fillY};
        const startY  = 130;
        const shift   = startY - targetY;
        if(fill){
          requestAnimationFrame(()=>requestAnimationFrame(()=>{
            fill.style.transform = 'translateY(-' + shift + 'px)';
          }));
        }
        if(txt && ${pct} > 8){
          setTimeout(()=>{ txt.style.opacity = '1'; txt.style.transition = 'opacity 0.5s ease'; }, 900);
        }
      })();
    <\/script>
  `;
}

function renderParticipant(count){
  const mod = count % CONFIG.premioCada;
  const remaining = CONFIG.premioCada - mod;
  const fillPct = (mod / CONFIG.premioCada) * 100;
  const label = remaining === 1 ? '¡1 más!' : `faltan ${remaining}`;
  app.innerHTML = `
    <p class="eyebrow">${CONFIG.cafeName}</p>
    <h1>¡Gracias por tu visita!</h1>
    ${cupHTML(fillPct, false, label)}
    <p class="progress-label">Eres la visita N.º <strong>${count}</strong></p>
    <p class="progress-label">Faltan <strong>${remaining}</strong> visitas para el próximo café gratis ☕</p>
    <p class="instructions">Vuelve a escanear el código en tu próxima visita para seguir participando.</p>
    <div class="contact">
      <a href="https://instagram.com/muley_coffee" target="_blank">📷 @muley_coffee</a>
      <a href="https://maps.google.com/?q=Avda.+Errazuriz+620,+Retiro" target="_blank">📍 Avda. Errazuriz 620</a>
      <a href="tel:+56944572336">📞 +569 4457 2336</a>
    </div>
    <p class="footer-note">${CONFIG.cafeName} · promoción de visitas</p>
  `;
}

function renderWinner(count, code){
  app.innerHTML = `
    <p class="eyebrow">${CONFIG.cafeName}</p>
    <h1>¡Ganaste un café! 🎉</h1>
    ${cupHTML(100, true, '¡Ganaste!')}
    <p class="progress-label">Fuiste la visita N.º <strong>${count}</strong></p>
    <div class="code-box">
      <div class="code" id="codeText">${code}</div>
      <div class="code-hint">Tu código de premio</div>
      <button class="copy" id="copyBtn">Copiar código</button>
    </div>
    <p class="instructions">Muestra este código en caja para canjear tu café gratis.</p>
    <div class="contact">
      <a href="https://instagram.com/muley_coffee" target="_blank">📷 @muley_coffee</a>
      <a href="https://maps.google.com/?q=Avda.+Errazuriz+620,+Retiro" target="_blank">📍 Avda. Errazuriz 620</a>
      <a href="tel:+56944572336">📞 +569 4457 2336</a>
    </div>
    <p class="footer-note">${CONFIG.cafeName} · promoción de visitas</p>
  `;
  const btn = document.getElementById('copyBtn');
  if(btn){
    btn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(code);
        btn.textContent = '¡Copiado!';
        setTimeout(()=>{btn.textContent='Copiar código';}, 1800);
      }catch(e){}
    });
  }
}

function renderCooldown(){
  app.innerHTML = `
    <p class="eyebrow">${CONFIG.cafeName}</p>
    <h1>Ya registramos tu visita ☕</h1>
    <p class="sub">Vuelve a escanear el código la próxima vez que nos visites para seguir participando.</p>
    <div class="contact">
      <a href="https://instagram.com/muley_coffee" target="_blank">📷 @muley_coffee</a>
      <a href="https://maps.google.com/?q=Avda.+Errazuriz+620,+Retiro" target="_blank">📍 Avda. Errazuriz 620</a>
      <a href="tel:+56944572336">📞 +569 4457 2336</a>
    </div>
  `;
}

function renderError(){
  app.innerHTML = `
    <p class="eyebrow">${CONFIG.cafeName}</p>
    <h1>No pudimos registrar tu visita</h1>
    <p class="sub">Intenta escanear el código nuevamente en un momento.</p>
  `;
}

function generateCode(count){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let suffix = '';
  for(let i=0;i<4;i++) suffix += chars[Math.floor(Math.random()*chars.length)];
  return `CAFE-${count}-${suffix}`;
}

function sendAlert(count, code){
  fetch(`https://ntfy.sh/${CONFIG.ntfyTopic}`, {
    method:'POST',
    body:`Nuevo ganador - Visita #${count} - Codigo: ${code}`,
    headers:{ 'Title':'Ganador de cafe', 'Tags':'tada' }
  }).catch(()=>{});
}

async function getRecord(){
  const res = await fetch(API + "/latest", {
    headers:{ 'X-Master-Key': CONFIG.masterKey, 'X-Bin-Meta': 'false' }
  });
  if(!res.ok) throw new Error('read failed');
  const data = await res.json();
  if(typeof data.count !== 'number') data.count = 0;
  if(!data.winners || typeof data.winners !== 'object') data.winners = {};
  if(!Array.isArray(data.visits)) data.visits = [];
  return data;
}

function getDevice(){
  const ua = navigator.userAgent || '';
  if(/android/i.test(ua)) return 'Android';
  if(/iphone|ipad|ipod/i.test(ua)) return 'iPhone';
  return 'Otro';
}

async function getCity(){
  try{
    const res = await fetch('https://ipapi.co/json/');
    if(!res.ok) return 'Desconocida';
    const geo = await res.json();
    if(geo && geo.city){
      return geo.region ? `${geo.city}, ${geo.region}` : geo.city;
    }
    return 'Desconocida';
  }catch(e){
    return 'Desconocida';
  }
}

async function putRecord(record){
  const res = await fetch(API, {
    method:'PUT',
    headers:{ 'Content-Type':'application/json', 'X-Master-Key': CONFIG.masterKey },
    body: JSON.stringify(record)
  });
  if(!res.ok) throw new Error('write failed');
}

const COOLDOWN_KEY = 'muley-coffee-last-visit';

async function main(){
  // evitar que el mismo navegador/celular sume varias visitas seguidas
  try{
    const last = localStorage.getItem(COOLDOWN_KEY);
    if(last){
      const elapsedMs = Date.now() - parseInt(last, 10);
      if(!isNaN(elapsedMs) && elapsedMs < CONFIG.cooldownMinutes * 60 * 1000){
        renderCooldown();
        return;
      }
    }
  }catch(e){ /* si el navegador bloquea localStorage, seguimos sin cooldown */ }

  let record, count;
  try{
    record = await getRecord();
    count = record.count + 1;
    record.count = count;
  }catch(e){
    renderError();
    return;
  }

  try{ localStorage.setItem(COOLDOWN_KEY, String(Date.now())); }catch(e){}

  const city = await getCity();
  record.visits.push({ ts: Date.now(), city, device: getDevice() });
  if(record.visits.length > 2000) record.visits = record.visits.slice(-2000);

  const isWinner = count % CONFIG.premioCada === 0;
  let code = null;
  if(isWinner){
    code = generateCode(count);
    record.winners[code] = { visitNumber: count, ts: Date.now(), redeemed:false, redeemedAt:null };
  }

  try{
    await putRecord(record);
  }catch(e){
    renderError();
    return;
  }

  if(isWinner){
    sendAlert(count, code);
    renderWinner(count, code);
  }else{
    renderParticipant(count);
  }
}

main();
</script>
</body>
</html>
