<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mi Tarjeta · Muley Coffee</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--esp:#2E1B12;--esps:#4A2F20;--crm:#F7EEE0;--crmd:#EDE0C8;--car:#C1812F;--card:#9C5F1F;--ppr:#FFFCF6;--grn:#6E8B6E;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 20%,rgba(193,129,47,.08) 0,transparent 45%),
  radial-gradient(circle at 80% 80%,rgba(193,129,47,.06) 0,transparent 45%),var(--crm);
  font-family:'Inter',sans-serif;color:var(--esp);padding:24px 16px;}
.card{background:var(--ppr);border-radius:28px;max-width:370px;width:100%;
  padding:34px 26px 28px;text-align:center;
  box-shadow:0 20px 60px -20px rgba(46,27,18,.28);border:1px solid var(--crmd);}
.eyebrow{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--card);font-weight:700;}
h1{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:600;margin:12px 0 4px;color:var(--esp);}
p.sub{font-size:.9rem;color:var(--esps);line-height:1.5;margin-top:6px;}
input{width:100%;font-family:'Inter',sans-serif;font-size:1rem;padding:13px 16px;
  border-radius:14px;border:1.5px solid var(--crmd);background:var(--crm);
  color:var(--esp);margin:14px 0 10px;text-align:center;}
input:focus{outline:2px solid var(--car);border-color:var(--car);}
button.primary{width:100%;border:none;font-family:'Inter',sans-serif;font-weight:600;
  font-size:.95rem;padding:13px;border-radius:14px;cursor:pointer;background:var(--car);color:var(--ppr);}
button.primary:active{background:var(--card);}
button.ghost{background:none;border:none;color:var(--card);font-size:.85rem;
  cursor:pointer;font-family:'Inter',sans-serif;margin-top:12px;text-decoration:underline;}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0 10px;}
.stamp{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;border:2px dashed var(--crmd);background:var(--crm);transition:all .4s ease;}
.stamp.on{border:2px solid var(--car);background:var(--car);box-shadow:0 3px 10px -3px rgba(193,129,47,.5);}
.stamp.on::after{content:'☕';}
.pbar-wrap{background:var(--crmd);border-radius:999px;height:8px;margin:4px 0 10px;overflow:hidden;}
.pbar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--car),var(--card));width:0%;transition:width 1s cubic-bezier(.22,1,.36,1);}
.plbl{font-size:.8rem;color:var(--esps);margin-bottom:4px;}
.code-box{margin:16px 0 8px;background:var(--crm);border:1.5px dashed var(--car);border-radius:14px;padding:14px;}
.code-box .code{font-family:monospace;font-weight:700;font-size:1.2rem;letter-spacing:.05em;}
.code-box .hint{font-size:.72rem;color:var(--esps);margin-top:4px;}
button.copy{margin-top:8px;border:none;background:var(--car);color:var(--ppr);
  font-weight:600;font-size:.82rem;padding:9px 16px;border-radius:999px;cursor:pointer;font-family:'Inter',sans-serif;}
.contact{margin-top:18px;padding-top:14px;border-top:1px solid var(--crmd);display:flex;flex-direction:column;gap:8px;}
.contact a{font-size:.82rem;color:var(--esps);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;}
.tag{font-size:.75rem;color:var(--esps);margin:2px 0 0;}
.tag strong{color:var(--esp);}
</style>
</head>
<body>
<main class="card" id="app">
  <p class="eyebrow">Muley Coffee</p>
  <h1>Mi tarjeta de fidelidad</h1>
  <p class="sub">Ingresa tu número de teléfono para ver tu progreso</p>
  <input type="tel" id="ph" placeholder="+56 9 XXXX XXXX" inputmode="tel">
  <button class="primary" id="enterBtn">Ver mi tarjeta</button>
</main>
<script>
const C={name:"Muley Coffee",sellosPremio:10,ntfy:"cafe-retiro-luis-7gx2k9",
  bin:"6a35da17f5f4af5e2912180b",key:"$2a$10$yFR5K98Hokx1AAmsjdgJjef5HeSUGsHbMRbzDDOa0f0qa2yKHawtW"};
const API="https://api.jsonbin.io/v3/b/"+C.bin;
const app=document.getElementById('app');

function normPhone(r){return r.replace(/\s+/g,'').replace(/[^\d+]/g,'');}

function contactHTML(){return`<div class="contact">
  <a href="https://instagram.com/muley_coffee" target="_blank">📷 @muley_coffee</a>
  <a href="https://maps.google.com/?q=Avda.+Errazuriz+620" target="_blank">📍 Avda. Errazuriz 620</a>
  <a href="tel:+56944572336">📞 +569 4457 2336</a>
</div>`;}

function stampsHTML(filled,total){
  let h='<div class="stamps">';
  for(let i=0;i<total;i++)h+=`<div class="stamp${i<filled?' on':''}"></div>`;
  return h+'</div>';
}

function genCode(total){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];
  return`FIEL-${total}-${s}`;
}

async function getRecord(){
  const r=await fetch(API+"/latest",{headers:{'X-Master-Key':C.key,'X-Bin-Meta':'false'}});
  if(!r.ok)throw new Error('read');
  const d=await r.json();
  if(!d.customers)d.customers={};
  if(!d.winners)d.winners={};
  if(!d.visits)d.visits=[];
  if(typeof d.count!=='number')d.count=0;
  return d;
}

async function putRecord(d){
  const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':C.key},body:JSON.stringify(d)});
  if(!r.ok)throw new Error('write');
}

function renderCard(phone,cust){
  const stamps=cust.stamps||0;
  const pct=Math.round((stamps/C.sellosPremio)*100);
  const rem=C.sellosPremio-stamps;
  const pending=(cust.prizes||[]).find(p=>!p.redeemed);
  app.innerHTML=`
    <p class="eyebrow">${C.name}</p>
    <h1>Mi tarjeta ☕</h1>
    <p class="tag">Teléfono: <strong>${phone}</strong></p>
    ${stampsHTML(stamps,C.sellosPremio)}
    <p class="plbl">${stamps} de ${C.sellosPremio} cafés</p>
    <div class="pbar-wrap"><div class="pbar" id="pb"></div></div>
    ${stamps===0?`<p class="sub">¡Empieza hoy! Cada café que compres suma un sello 🎉</p>`:
      rem>0?`<p class="sub">Faltan <strong style="color:var(--card)">${rem}</strong> café${rem>1?'s':''} para ganar uno gratis</p>`:``}
    ${pending?`<div class="code-box">
      <div class="code">${pending.code}</div>
      <div class="hint">¡Tienes un café gratis pendiente de canje!</div>
      <button class="copy" id="cpBtn">Copiar código</button>
    </div>
    <p class="sub">Muéstralo en caja para canjearlo.</p>`:''}
    ${(cust.totalPrizesWon||0)>0?`<p style="font-size:.75rem;color:var(--esps);margin-top:8px;">Premios ganados: ${cust.totalPrizesWon}</p>`:''}
    ${contactHTML()}
    <button class="ghost" id="backBtn">← Cambiar número</button>`;
  setTimeout(()=>{const b=document.getElementById('pb');if(b)b.style.width=pct+'%';},100);
  document.getElementById('backBtn').addEventListener('click',renderLogin);
  const cp=document.getElementById('cpBtn');
  if(cp)cp.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(pending.code);
      cp.textContent='¡Copiado!';setTimeout(()=>{cp.textContent='Copiar código';},1800);}catch(e){}
  });
}

function renderLogin(){
  app.innerHTML=`
    <p class="eyebrow">${C.name}</p>
    <h1>Mi tarjeta de fidelidad</h1>
    <p class="sub">Ingresa tu número de teléfono para ver tu progreso</p>
    <input type="tel" id="ph" placeholder="+56 9 XXXX XXXX" inputmode="tel">
    <button class="primary" id="enterBtn">Ver mi tarjeta</button>
    ${contactHTML()}`;
  document.getElementById('enterBtn').addEventListener('click',handleEnter);
  document.getElementById('ph').addEventListener('keydown',e=>{if(e.key==='Enter')handleEnter();});
}

async function handleEnter(){
  const phone=normPhone((document.getElementById('ph').value||'').trim());
  if(phone.length<8){document.getElementById('ph').style.borderColor='var(--card)';return;}
  app.innerHTML=`<p class="eyebrow">${C.name}</p><h1>Cargando…</h1>`;
  try{
    const rec=await getRecord();
    if(!rec.customers[phone]){
      rec.customers[phone]={phone,stamps:0,totalPrizesWon:0,prizes:[],createdAt:Date.now()};
      await putRecord(rec);
    }
    renderCard(phone,rec.customers[phone]);
  }catch(e){
    app.innerHTML=`<p class="eyebrow">${C.name}</p><h1>Error al cargar</h1>
      <p class="sub" style="margin-top:10px;">Intenta de nuevo en un momento.</p>
      <button class="primary" id="retryBtn" style="margin-top:14px;">Reintentar</button>`;
    document.getElementById('retryBtn').addEventListener('click',renderLogin);
  }
}

document.getElementById('enterBtn').addEventListener('click',handleEnter);
document.getElementById('ph').addEventListener('keydown',e=>{if(e.key==='Enter')handleEnter();});
</script>
</body>
</html>
